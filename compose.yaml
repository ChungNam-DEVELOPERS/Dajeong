name: dajeong

services:
  postgres:
    image: postgres:16.15-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DAJEONG_DB_NAME:-dajeong}
      POSTGRES_USER: ${DAJEONG_DB_USER:-dajeong}
      POSTGRES_PASSWORD: ${DAJEONG_DB_PASSWORD:-dajeong-local-only}
    ports:
      - "127.0.0.1:${DAJEONG_DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    shm_size: 128mb
    stop_grace_period: 10s

volumes:
  postgres-data:
