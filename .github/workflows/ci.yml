name: CI

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      DAJEONG_API_AUDIENCE: http://localhost:8080/api
      DAJEONG_COGNITO_CLIENT_ID: dajeong-web-local
      DAJEONG_COGNITO_DOMAIN: http://127.0.0.1:9090
      DAJEONG_ENV: local
      DAJEONG_WEB_BASE_URL: http://localhost:3000
      EXPO_NO_TELEMETRY: "1"
      EXPO_PUBLIC_API_BASE_URL: http://127.0.0.1:8080
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8080
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          version: 11.22.0
          runtime: node@24.19.0
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify dependency security mitigations
        run: pnpm check:dependency-security

      - name: Verify toolchain
        run: pnpm check:toolchain

      - name: Validate environment contract and scan secrets
        run: pnpm check:configuration

      - name: Validate PostgreSQL Compose configuration
        run: pnpm check:db

      - name: Test and package API
        run: pnpm check:api

      - name: Verify generated OpenAPI client
        run: pnpm check:api-client

      - name: Lint and typecheck
        run: pnpm check:shared-config

      - name: Build web
        run: pnpm --filter @dajeong/web build

      - name: Export Expo web bundle
        run: pnpm --filter @dajeong/mobile run export:web
