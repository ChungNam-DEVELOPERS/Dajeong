name: 버그 제보
description: 재현 가능한 오류나 예상과 다른 동작을 알려주세요.
title: "[Bug] "
body:
  - type: dropdown
    id: area
    attributes:
      label: 영향 영역
      description: 문제가 발생한 영역을 선택해 주세요.
      options:
        - 프론트엔드
        - 백엔드
        - 프론트엔드와 백엔드 모두
        - 개발 환경 또는 배포
        - 잘 모르겠음
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 문제 설명
      description: 어떤 문제가 발생했는지 명확하게 설명해 주세요.
      placeholder: 무엇을 하던 중 어떤 문제가 발생했나요?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 재현 방법
      description: 문제를 다시 확인할 수 있도록 순서대로 적어 주세요.
      placeholder: |
        1. ... 페이지로 이동합니다.
        2. ... 버튼을 누릅니다.
        3. ... 오류가 발생합니다.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 기대한 동작
      placeholder: 원래 어떻게 동작해야 하나요?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 실제 동작
      placeholder: 실제로는 어떻게 동작했나요? 오류 메시지가 있다면 함께 적어 주세요.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: 실행 환경
      description: 문제와 관련된 항목만 적어 주세요.
      placeholder: |
        - OS: Windows 11
        - 브라우저: Chrome 128
        - 기기: Desktop / Mobile
        - 실행 환경: local / development / production

  - type: textarea
    id: attachments
    attributes:
      label: 추가 자료
      description: 스크린샷, 영상, 로그 또는 참고 링크가 있다면 첨부해 주세요. 민감 정보는 제거해 주세요.

  - type: checkboxes
    id: checks
    attributes:
      label: 확인 사항
      options:
        - label: 동일한 이슈가 이미 등록되어 있는지 확인했습니다.
          required: true
        - label: 로그와 첨부 자료에서 개인정보나 비밀 값을 제거했습니다.
          required: true
